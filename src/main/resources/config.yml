# OXYGENATED CONFIG FILE
# Use minimessage formatting (https://docs.papermc.io/adventure/minimessage/)
# Do not change anything if you do not know what you're doing!

#------------
# MAIN PLUGIN | RESTART/RELOAD AFTER EDITING THIS SECTION
#------------
default-prefix: "<gray>[<bold>OXYGENATED</bold>]</gray>"

#----------
# BROADCAST
#----------

broadcast:
  prefix: "<gold>[<bold>BROADCAST</bold>]</gold>"
  fade-in-ticks: 20
  fade-out-ticks: 20
  stay-ticks: 60
  sound-volume: 1
  sound-pitch: 1
  title-enabled: true
  title-text: "BROADCAST"

#-----
# HEAL
#-----

heal:
  hunger-restored: true
  potion-effects-cleared: true
  saturation-restored: true
  fire-extinguished: true

  messages:
    self-only-player: "<red>Only players may heal themselves."
    no-permission-self: "<red>You do not have permission."
    no-permission-others: "<red>You do not have permission to heal others."
    player-not-found: "<red>Player '<white>{player}</white>' not found."
    self-healed: "<green>You have been healed."
    healed-other: "<green>You healed <yellow>{player}</yellow>."
    healed-by-other: "<green>You have been healed by <yellow>{sender}</yellow>."


#----------------
# EVENT WARP
#----------------

event-warp:

  # Master toggle for the system
  enabled: true

  # Whether disabled warps appear in /eventwarp list
  show-disabled-warps: true

  # Messages (MiniMessage)
  messages:
    usage: "<red>Usage: /eventwarp <add|delete|enable|disable|list|tp>"
    created: "<green>Event warp <yellow>{warp}</yellow> created."
    deleted: "<green>Event warp <yellow>{warp}</yellow> deleted."
    enabled: "<green>Event warp <yellow>{warp}</yellow> enabled."
    disabled: "<red>Event warp <yellow>{warp}</yellow> disabled."
    not-found: "<red>Warp not found."
    warp-disabled: "<red>This warp is disabled."
    teleported: "<green>Teleported <yellow>{count}</yellow> entities."
    no-entities: "<red>No entities matched the selector."
    invalid-selector: "<red>Invalid selector."
    console-add-error: "<red>Only players may create warps."

  # DO NOT EDIT MANUALLY
  warps: {}
